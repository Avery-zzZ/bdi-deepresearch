[project]
name = "bdideepagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "deepagents>=0.4.4",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.128.0",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "ragflow-sdk>=0.22.1",
    "tavily-python>=0.7.17",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "langgraph-cli[inmem]>=0.4.11",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "."


[tool.ruff.lint]
select = [
    "ALL"  # Enable all rules by default
]
ignore = [
    "E501",
    "D",
    "RUF",
    "TD002",
    "TD003",
    "A001",
    "BLE001",
]

[tool.ruff.per-file-ignores]
"apps/terminal.py" = ["T201"]
"tests/*" = ["ANN201", "T201", "PLR2004"]
"middlewares/au2_compression.py" = ["ALL"]
